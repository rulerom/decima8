<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decima-8 Tile Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="glcanvas"></canvas>
    
    <div id="info-panel">
        <h2>Decima-8 Tile</h2>
        
        <div class="section">
            <div class="section-title">VSB Inputs (0-15)</div>
            <div id="vsb-inputs">
                <!-- VSB inputs will be inserted here -->
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Weights (-127 to 127)</div>
            <div id="weight-inputs">
                <!-- Weight inputs will be inserted here -->
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Tile Parameters</div>
            <div class="input-row">
                <label>thr_lo: <input type="number" id="thr-lo-input" value="2000"></label>
            </div>
            <div class="input-row">
                <label>thr_hi: <input type="number" id="thr-hi-input" value="3000"></label>
            </div>
            <div class="input-row">
                <label>decay16: <input type="number" id="decay-input" value="500" min="0" max="65535"></label>
            </div>
            <div class="input-row">
                <label>domain: <input type="number" id="domain-input" value="0" min="0" max="15"></label>
            </div>
        </div>
        
        <div class="section">
            <div class="button-row">
                <button id="flash-btn" class="btn btn-flash">FLASH</button>
                <button id="reset-btn" class="btn btn-reset">RESET</button>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Status</div>
            <div class="stat">
                <span class="label">Accumulator:</span>
                <span id="accumulator-value">0</span>
            </div>
            <div class="stat">
                <span class="label">Lock:</span>
                <span id="lock-value">NO</span>
            </div>
            <div class="stat">
                <span class="label">Phase:</span>
                <span id="phase-value">-</span>
            </div>
            <div class="stat">
                <span class="label">Fire:</span>
                <span id="fire-value">NO</span>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Display</div>
            <div class="input-row">
                <label>Brightness: <input type="range" id="brightness-slider" min="0.1" max="2" step="0.1" value="1"></label>
            </div>
        </div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
